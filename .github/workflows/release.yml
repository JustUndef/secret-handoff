name: Windows release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Package test version (without publishing)'
        required: true
        default: '0.0.0-rc.0'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-2025
    timeout-minutes: 25
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - name: Validate version tag
        env:
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && format('v{0}', inputs.version) || github.ref_name }}
        run: |
          if ($env:RELEASE_TAG -cnotmatch '^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-(alpha|beta|rc)\.(0|[1-9][0-9]*))?$') { throw 'RELEASE_TAG_INVALID' }
          "RELEASE_VERSION=$($env:RELEASE_TAG.Substring(1))" >> $env:GITHUB_ENV
      - name: Build and run local synthetic integration tests
        run: ./scripts/Build-Prototype.ps1 -DotnetPath (Get-Command dotnet).Source
      - name: Locate Inno Setup compiler
        run: |
          $compiler = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path -LiteralPath $compiler)) { throw 'INNO_SETUP_MISSING' }
          "ISCC_PATH=$compiler" >> $env:GITHUB_ENV
      - name: Build self-contained ZIP and installer
        id: package
        run: ./scripts/Build-Release.ps1 -Version $env:RELEASE_VERSION -DotnetPath (Get-Command dotnet).Source -IsccPath $env:ISCC_PATH
      - name: Verify packaged launcher
        run: |
          $app = Join-Path (Split-Path '${{ steps.package.outputs.release_dir }}') 'app'
          ./scripts/Test-Package.ps1 -AppDirectory $app
      - name: Verify install, reinstall and uninstall
        run: |
          $installer = Get-ChildItem -LiteralPath '${{ steps.package.outputs.release_dir }}' -Filter '*-Setup.exe'
          ./scripts/Test-Installer.ps1 -InstallerPath $installer.FullName
      - name: Verify optional PATH integration with synthetic registry data
        run: |
          $app = Join-Path (Split-Path '${{ steps.package.outputs.release_dir }}') 'app'
          ./scripts/Test-InstallerPath.ps1 -PublishDirectory $app -IsccPath $env:ISCC_PATH
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-release
          path: ${{ steps.package.outputs.release_dir }}/*
          if-no-files-found: error

  publish:
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: windows-release
          path: release
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          args=(--verify-tag --generate-notes --title "Secret Handoff $RELEASE_TAG")
          if [[ "$RELEASE_TAG" == *-* ]]; then args+=(--prerelease); fi
          gh release create "$RELEASE_TAG" release/* "${args[@]}"
